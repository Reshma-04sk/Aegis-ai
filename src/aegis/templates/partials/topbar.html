<header class="topbar">
  <a class="brand" href="/" aria-label="AEGIS home">
    <svg viewBox="0 0 32 32" aria-hidden="true" focusable="false">
      <circle cx="21" cy="12" r="4" />
      <path d="M4 22c4-3 8-3 12 0s8 3 12 0" />
    </svg>
    <span>AEGIS</span>
  </a>
  <nav aria-label="Main">
    {% for link in nav %}
    <a href="{{ link.href }}"{% if link.scroll %} data-scroll{% endif %}{% if link.cta %} class="nav-cta"{% endif %}>
      {{- link.text -}}
    </a>
    {% endfor %}
  </nav>
</header>
