<header class="topbar">
  <a class="brand" href="/" aria-label="AEGIS home">
    <svg viewBox="0 0 32 32" aria-hidden="true" focusable="false">
      <path class="shield" d="M16 2.5 5 6.8v7.9c0 7 4.7 12 11 14.3 6.3-2.3 11-7.3 11-14.3V6.8Z" />
      <path d="M10 17c2-1.5 4-1.5 6 0s4 1.5 6 0" />
      <path class="sun-line" d="M10 12c2-1.5 4-1.5 6 0s4 1.5 6 0" />
    </svg>
    <span>AEGIS</span>
  </a>
  <nav aria-label="Main">
    {% for link in nav %}
    <a href="{{ link.href }}"{% if link.scroll %} data-scroll{% endif %}{% if link.cta %} class="nav-cta"{% endif %}>
      {{- link.text -}}
    </a>
    {% endfor %}
  </nav>
</header>
