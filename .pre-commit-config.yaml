# Same gates as CI, run locally before each commit: `uvx pre-commit install`.
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff lint
        entry: uv run ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --check
        language: system
        types: [python]
      - id: mypy
        name: mypy strict
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: eslint
        name: eslint
        entry: npx eslint
        language: system
        files: \.(js|mjs)$
      - id: tsc
        name: tsc --checkJs
        entry: npm run typecheck
        language: system
        files: \.(js|ts)$
        pass_filenames: false
      - id: prettier
        name: prettier
        entry: npx prettier --check
        language: system
        files: \.(js|mjs|ts|json)$
