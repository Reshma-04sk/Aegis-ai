<section class="band" id="now" tabindex="-1" aria-labelledby="now-title">
  <div class="glass wide live">
    <div class="live-head">
      <h2 id="now-title">Right now, city by city</h2>
      <div class="chips" role="group" aria-label="Choose a city">
        <button type="button" class="chip" aria-pressed="true" data-city="Delhi">Delhi</button>
        <button type="button" class="chip" aria-pressed="false" data-city="Mumbai">Mumbai</button>
        <button type="button" class="chip" aria-pressed="false" data-city="Kolkata">Kolkata</button>
        <button type="button" class="chip" aria-pressed="false" data-city="Bengaluru">Bengaluru</button>
        <button type="button" class="chip" aria-pressed="false" data-city="Chennai">Chennai</button>
      </div>
    </div>
    <div class="live-body" id="live" aria-live="polite" aria-busy="true">
      <p class="help">Fetching the latest forecast for Delhi.</p>
    </div>
  </div>
</section>
