<details class="section">
  <summary>Daily commute (optional)</summary>
  <div class="grid">
    <div class="field">
      <label for="distance">One-way distance (km)</label>
      <input id="distance" type="number" inputmode="decimal" min="0.5" max="100" step="0.5" placeholder="e.g. 8" />
    </div>
    <div class="field">
      <label for="mode">How you travel now</label>
      <select id="mode">
        {% for value, label in modes.items() %}
        <option value="{{ value }}">{{ label }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="field">
      <label for="occupants">People in the car</label>
      <input id="occupants" type="number" min="1" max="7" step="1" value="1" />
    </div>
    <div class="field">
      <label for="trips">One-way trips per week</label>
      <input id="trips" type="number" min="1" max="28" step="1" value="10" />
    </div>
  </div>
</details>
