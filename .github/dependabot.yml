# Version-update pull requests are paused (limit 0) while the PromptWars challenge is judged, so
# `main` stays the only branch. Vulnerabilities are still caught: pip-audit and npm audit run in
# CI on every push. Raise the limits to resume updates.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
