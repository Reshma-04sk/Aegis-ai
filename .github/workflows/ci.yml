name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    name: Lint, types, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.7"
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
      - run: node --test tests/js/

  e2e:
    name: Browser tests (axe WCAG 2.1 AA, 1440px + 375px)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.7"
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: uv sync --locked
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run vendor
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.7"
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: uv export --frozen --no-dev --no-emit-project --format requirements-txt -o requirements.lock
      - run: uvx pip-audit==2.10.1 --strict --require-hashes --disable-pip -r requirements.lock
      - run: npm audit --audit-level=low

  zap:
    name: OWASP ZAP baseline (dynamic security scan)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.7"
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: uv sync --locked
      - run: npm ci --omit=dev --ignore-scripts && npm run vendor
      - name: Start the app (fixed air data, no network or keys)
        run: |
          PYTHONPATH=tests nohup uv run uvicorn --factory fixture_app:app --app-dir tests/e2e \
            --host 0.0.0.0 --port 8799 > uvicorn.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8799/api/health && exit 0; sleep 1; done
          cat uvicorn.log; exit 1
      - uses: zaproxy/action-baseline@v0.15.0
        with:
          target: http://localhost:8799/
          fail_action: true
          allow_issue_writing: false
          # Reviewed false positives and intended behaviour, each with its reason. Anything new fails.
          rules_file_name: .zap/rules.tsv
          cmd_options: -a
