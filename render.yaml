services:
  - type: web
    name: aegis-ai
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false # entered in the Render dashboard on creation, never committed
      - key: OPENAQ_API_KEY
        sync: false # optional; enables nearest-station measurements
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: TRUSTED_PROXY_HOPS
        value: 1 # Render's load balancer appends the real client IP as the last hop
