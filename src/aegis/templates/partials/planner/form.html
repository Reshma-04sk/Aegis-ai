<form id="plan-form" novalidate aria-describedby="form-help">
  <p id="form-help" class="help">Only the location is required. Your household is saved on this device only.</p>

  <div class="field">
    <label for="location">City or neighbourhood</label>
    <div class="row">
      <input id="location" name="location" type="text" autocomplete="address-level2" maxlength="100"
             placeholder="e.g. Delhi" aria-describedby="location-error" required />
      <button type="button" id="geo-btn" class="secondary">Use my location</button>
    </div>
    <p id="location-error" class="error" hidden></p>
  </div>

  <fieldset>
    <legend>Your household</legend>
    <ul id="members" class="stack" aria-label="Household members"></ul>
    <button type="button" id="add-member" class="secondary small">+ Add a person</button>
  </fieldset>

  <fieldset>
    <legend>Today's outdoor plans</legend>
    <p class="help">AEGIS finds the cleanest forecast hours for each one.</p>
    <ul id="activities" class="stack" aria-label="Planned activities"></ul>
    <button type="button" id="add-activity" class="secondary small">+ Add a plan</button>
  </fieldset>

  {% include "partials/planner/home.html" %}
  {% include "partials/planner/commute.html" %}

  <div class="field">
    <label for="note">Anything else? (optional)</label>
    <textarea id="note" rows="2" maxlength="300"
              placeholder="e.g. My son has asthma and wants to play football after school"></textarea>
  </div>

  <div class="actions">
    <button type="submit" id="submit-btn">Plan my day</button>
    <button type="button" id="forget-btn" class="link">Forget saved household</button>
  </div>
</form>
