[project]
name = "aegis-ai"
version = "2.0.0"
description = "AEGIS: GenAI urban air quality assistant for families navigating winter smog"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
dependencies = [
    "fastapi==0.165.0",
    "uvicorn[standard]==0.54.0",
    "httpx==0.28.1",
    "pydantic==2.14.3",
    "jinja2==3.1.6",
]

[dependency-groups]
dev = [
    "hypothesis==6.170.16",
    "mypy==2.4.1",
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "pytest-cov==7.1.0",
    "respx==0.23.1",
    "ruff==0.17.5",
    "schemathesis==4.33.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aegis"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q --cov=aegis --cov-report=term-missing --cov-fail-under=90"
filterwarnings = ["error", "ignore::DeprecationWarning:starlette.*", "ignore:.*httpx2.*"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "C4", "PT", "RET",
    "C90", "PL", "N", "D", "FBT", "FURB", "PTH", "PERF", "TC", "ARG", "BLE", "DTZ", "T20", "ERA",
]
ignore = ["D105", "D107"]  # magic methods and __init__ are covered by the class docstring

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel"]  # field types are resolved at runtime

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 6

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "E501", "PT018", "D", "PLR2004", "ARG", "FBT", "PLR0913", "PLC0415"]

[tool.mypy]
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[tool.pyright]
venvPath = "."
venv = ".venv"
